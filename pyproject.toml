[project]
name = "freetar"
version = "0.22.0"
description = "an alternative frontend to ultimate-guitar.com"
authors = [{ name = "kmille", email = "github@androidloves.me" }]
readme = "README.md"
requires-python = ">=3.11.5"
dependencies = [
    "requests[socks]>=2.32.3",
    "beautifulsoup4>=4.12.0",
    "flask>=3.1",
    "waitress>=3.0.2",
    "flask-minify>=0.50",
    "flask-caching>=2.3.1",
]

[project.urls]
Homepage = "https://github.com/kmille/freetar"
Repository = "https://github.com/kmille/freetar"
Issues = "https://github.com/kmille/freetar/issues"

[project.scripts]
freetar = "freetar.backend:main"

[dependency-groups]
dev = [
    "pdbpp>=0.12.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
